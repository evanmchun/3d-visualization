<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Curve Centering</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container"></div>
    <script>
        // Add global error handler
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            console.error('Error: ' + msg);
            console.error('URL: ' + url);
            console.error('Line: ' + lineNo);
            console.error('Column: ' + columnNo);
            console.error('Error object: ', error);
            return false;
        };
    </script>
    <!-- Load Three.js and its modules -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // Make THREE and OrbitControls available globally for main.js
        window.THREE = THREE;
        window.OrbitControls = OrbitControls;
        
        // Check if Three.js loaded correctly
        if (typeof THREE === 'undefined') {
            console.error('Three.js failed to load');
        } else {
            console.log('Three.js loaded successfully', THREE.REVISION);
        }
        
        // Check if OrbitControls loaded correctly
        if (typeof OrbitControls === 'undefined') {
            console.error('OrbitControls failed to load');
        } else {
            console.log('OrbitControls loaded successfully');
        }
    </script>
    <script src="main.js" type="module"></script>
</body>
</html>
